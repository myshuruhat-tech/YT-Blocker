name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        run: |
          if [ -f yt-blocker.zip ]; then unzip -qo yt-blocker.zip; fi
          S=$(find . -name settings.gradle.kts | head -n1)
          if [ -z "$S" ]; then
            echo "settings.gradle.kts not found"; ls -R | head -50; exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$S")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
